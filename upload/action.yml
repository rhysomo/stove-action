name: STOVE Build Upload
description: Upload a game build to STOVE Studio with the official STOVE Uploader CLI.
author: insd47

inputs:
  game-id:
    description: STOVE game ID of the target product.
    required: true
  source-path:
    description: Directory containing the build to upload.
    required: true
  description:
    description: Build description shown in STOVE Studio (1-60 characters).
    required: true
  user-id:
    description: STOVE account email with access to the target product.
    required: true
  password:
    description: STOVE account password.
    required: true
  caller-detail:
    description: Caller-detail key issued by STOVE support (store.support@smilegate.com).
    required: true
  excluded-files:
    description: Comma-separated file names to exclude from the upload.
    required: false
  excluded-extensions:
    description: Comma-separated file extensions (without dot) to exclude from the upload.
    required: false
  excluded-directories:
    description: Comma-separated directory names to exclude from the upload.
    required: false
  resume-count:
    description: Number of automatic resume attempts on interrupted uploads.
    required: false
    default: '3'
  show-progress:
    description: Show the CLI progress bar in the log. Hidden by default to keep CI logs readable.
    required: false
    default: 'false'
  cli-path:
    description: Path to a pre-installed STOVEUploaderCLI.exe (or a directory containing it). Skips the download.
    required: false
  cli-url:
    description: Download URL of the STOVE Uploader CLI archive.
    required: false
    default: https://dl-sgvn.onstove.com/tools/UploadTool/STOVEUploaderCLI.zip

outputs:
  studio-url:
    description: STOVE Studio build management URL printed by the CLI on success.

runs:
  using: node24
  main: dist/index.js

branding:
  color: orange
  icon: upload-cloud
